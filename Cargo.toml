[package]
name = "h2ac-rs"
version = "1.1.0"
edition = "2024"
description = "Helldivers 2 Auto Stratagem Caller — Rust rewrite"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
# ── plan7 Step 3：参考实现原文（hd2-preset-helper 0.1.4）所需依赖 ──
# 版本与 feature 组合与参考 Cargo.toml 完全一致，避免移植后再做版本适配。
anyhow = "1.0.104"
fast_image_resize = { version = "6.1.0", features = ["image"] }
half = "2.7.1"
rayon = "1.12.0"
rust-embed = { version = "8.12.0", default-features = false, features = [
    "debug-embed",
    "deterministic-timestamps",
] }
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
# 注：windows crate 仍为 0.58（参考是 0.62.2）——升级时机见 plan7 §5.5：
# 同一 crate 内 `use windows::…` 只能解析到一个版本，故必须全 crate 升级，
# 且要照参考 capture/windows/wgc.rs 落地时一并处理（见 Step 4）。
# 注：windows crate 仍为 0.58（参考是 0.62.2，本机缓存最高 0.61.3）——升级时机见 plan7 §5.5：
# 同一 crate 内 `use windows::…` 只能解析到一个版本，故必须全 crate 升级，
# 且要等 loadout_sync 的 Win32/DXGI 适配层归档后（否则要为待删代码做迁移）。
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Devices_Display",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
